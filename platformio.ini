; ToolKitOSC ESP32 board firmware. See README.md and PROTOCOL.md.
; Build/flash:     pio run -e <board> -t upload   |   Serial monitor:  pio device monitor
; Core tests (PC): pio test -e native   (needs a MinGW-w64 GCC on PATH, no hardware)

[platformio]
default_envs = esp32-s3-devkitc-1

[esp32_base]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -Wall
    -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    ESP32Async/AsyncTCP@^3.4.0
    ESP32Async/ESPAsyncWebServer@^3.7.0
    tzapu/WiFiManager@^2.0.17

; Each env picks a default board profile (src/core/pins.cpp). It only applies until one is
; chosen on the setup page or with the `board` serial command.

; Espressif ESP32-S3-DevKitC-1. Plug into the port marked "UART".
; For N16R8V / N32R8V (WROOM-2, octal flash), add:  board_build.arduino.memory_type = opi_opi
[env:esp32-s3-devkitc-1]
extends = esp32_base
board = esp32-s3-devkitc-1
build_flags = ${esp32_base.build_flags} -DTKOSC_DEFAULT_BOARD=\"esp32-s3-devkitc-1\"

; WEMOS LOLIN S3 (N16R8). Flash and monitor through the port marked "USB".
[env:lolin_s3]
extends = esp32_base
board = lolin_s3
build_flags = ${esp32_base.build_flags} -DTKOSC_DEFAULT_BOARD=\"lolin-s3\"

; Seeed Studio XIAO ESP32-S3
[env:seeed_xiao_esp32s3]
extends = esp32_base
board = seeed_xiao_esp32s3
build_flags = ${esp32_base.build_flags} -DTKOSC_DEFAULT_BOARD=\"xiao-esp32s3\" -DARDUINO_USB_CDC_ON_BOOT=1

; Seeed Studio XIAO ESP32-C3
[env:seeed_xiao_esp32c3]
extends = esp32_base
board = seeed_xiao_esp32c3
build_flags = ${esp32_base.build_flags} -DTKOSC_DEFAULT_BOARD=\"xiao-esp32c3\" -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; Generic ESP32-C3 boards (DevKitM-1, C3 SuperMini, ...)
[env:esp32-c3]
extends = esp32_base
board = esp32-c3-devkitm-1
build_flags = ${esp32_base.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; Generic ESP32 (WROOM-32 / WROVER) devkit
[env:esp32dev]
extends = esp32_base
board = esp32dev

; The shared core (protocol, outputs, pin tables) built for the PC, for the Unity tests in test/.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<core/>
build_flags =
    -Wall
    -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
